[project]
name = "context-memory-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "pydantic-settings",
    "openai",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "httpx2>=2.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
