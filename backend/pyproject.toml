[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-memory"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.138",
    "uvicorn",
    "sqlmodel",
    "pydantic-settings",
    "openai",
]

[project.scripts]
context-memory = "context_memory.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "httpx2>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["context_memory"]
artifacts = ["context_memory/static/"]

[tool.hatch.build.targets.sdist]
include = ["context_memory", "pyproject.toml", "README.md"]
artifacts = ["context_memory/static/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
