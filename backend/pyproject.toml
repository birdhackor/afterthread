[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afterthread"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.138",
    "uvicorn",
    "sqlmodel",
    "pydantic-settings",
    "openai",
    "typer>=0.26.8",
]

[project.scripts]
afterthread = "afterthread.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "httpx2>=2.5.0",
    # Not needed to RUN builds (uv provisions the build backend in an isolated
    # environment from [build-system].requires) -- present only so ruff/ty can
    # resolve the first-party build hook's imports (see hatch_build.py).
    "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["afterthread"]
artifacts = ["afterthread/static/"]

[tool.hatch.build.targets.sdist]
# hatch_build.py must ship in the sdist: `uv build` builds the wheel FROM the
# unpacked sdist, and the wheel hook below needs the script present there.
include = ["afterthread", "pyproject.toml", "README.md", "hatch_build.py"]
artifacts = ["afterthread/static/"]

# Guard hook (see hatch_build.py): non-editable builds fail loudly when the
# frontend bundle has not been staged into afterthread/static/, instead of
# silently producing a UI-less wheel. Editable installs (`uv sync`) are exempt.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
