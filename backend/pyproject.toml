[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "afterthread"
version = "0.2.0"
description = "Preserve architectural decisions, trade-offs, and next actions in a local web app."
readme = "PYPI_README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "birdhackor" }]
keywords = [
    "architecture decisions",
    "knowledge management",
    "local-first",
    "personal knowledge base",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastapi[standard]>=0.138",
    "uvicorn",
    "sqlmodel",
    "pydantic-settings",
    "openai",
    "typer>=0.26.8",
    "httpx2>=2.5.0",
]

[project.urls]
Documentation = "https://birdhackor.github.io/afterthread/"

[project.scripts]
afterthread = "afterthread.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    # Not needed to RUN builds (uv provisions the build backend in an isolated
    # environment from [build-system].requires) -- present only so ruff/ty can
    # resolve the first-party build hook's imports (see hatch_build.py).
    "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["afterthread"]
artifacts = ["afterthread/static/"]

[tool.hatch.build.targets.sdist]
# hatch_build.py must ship in the sdist: `uv build` builds the wheel FROM the
# unpacked sdist, and the wheel hook below needs the script present there.
include = [
    "afterthread",
    "LICENSE",
    "PYPI_README.md",
    "pyproject.toml",
    "README.md",
    "hatch_build.py",
]
artifacts = ["afterthread/static/"]

# Guard hook (see hatch_build.py): non-editable builds fail loudly when the
# frontend bundle has not been staged into afterthread/static/, instead of
# silently producing a UI-less wheel. Editable installs (`uv sync`) are exempt.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
